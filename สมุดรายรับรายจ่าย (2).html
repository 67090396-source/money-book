<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดรายรับรายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#12203a;--mute:#6a7891;--line:#e1e7f1;--in:#0e9f6e;--out:#d64545;--a1:#0a2f7a;--a2:#1b5ed8;--chip:#f1f5fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--mute:#8d9bb5;--line:#223049;--in:#34d399;--out:#ff7b7b;--a1:#0b2a6b;--a2:#2563eb;--chip:#1a2538}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--mute:#8d9bb5;--line:#223049;--in:#34d399;--out:#ff7b7b;--a1:#0b2a6b;--a2:#2563eb;--chip:#1a2538}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
.left{display:grid;gap:14px;position:sticky;top:16px}
.hero{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 28px rgba(10,47,122,.28)}
.hero small{opacity:.8;font-size:.85rem}
.bal{font-size:2.4rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:4px 0 14px;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:.8rem}
.mini b{display:block;font-size:1.05rem;margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;display:grid;gap:4px;justify-items:center;font-size:.78rem;font-weight:600}
.act i{font-style:normal;font-size:1.35rem;width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.act.in i{background:rgba(14,159,110,.15)}.act.out i{background:rgba(214,69,69,.14)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.panel h2{font-size:.95rem;margin:0 0 10px}
.months{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.months button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1rem}
.months b{font-size:1rem}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.85rem;margin:8px 0}
.cat .t{height:6px;background:var(--chip);border-radius:3px;grid-column:2/4;overflow:hidden}
.cat .t i{display:block;height:100%;background:var(--out);border-radius:3px}
.day{font-size:.78rem;color:var(--mute);font-weight:600;margin:14px 2px 4px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ic{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:1.2rem;flex:none}
.tx .m{flex:1;min-width:0}.tx .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tx .m span{font-size:.78rem;color:var(--mute)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.del{border:0;background:none;color:var(--mute);font-size:1.2rem;padding:4px 8px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:min(480px,100%);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:92vh;overflow:auto}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0;font-size:1.1rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:600}
.seg button.on.out{background:var(--out);color:#fff}.seg button.on.in{background:var(--in);color:#fff}
.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sheet label{font-size:.8rem;color:var(--mute);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:1.5rem;font-weight:800}
.pri{border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:14px;border-radius:14px;font-weight:700}
.sec{border:1px solid var(--line);background:transparent;padding:12px;border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12203a;color:#fff;padding:11px 18px;border-radius:14px;font-size:.88rem;display:none;z-index:20;max-width:90vw;text-align:center}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr);padding:12px 12px 40px}.left{position:static}.bal{font-size:2.1rem}}
</style>
</head>
<body>
<div class="wrap">
 <div class="left">
  <section class="hero">
   <small>ยอดเงินคงเหลือทั้งหมด</small>
   <div class="bal" id="bal">฿0.00</div>
   <div class="mini"><div>รายรับเดือนนี้<b id="mi">฿0</b></div><div>รายจ่ายเดือนนี้<b id="mo">฿0</b></div></div>
  </section>
  <div class="acts">
   <button class="act in" data-add="in"><i>⬇</i>รายรับ</button>
   <button class="act out" data-add="out"><i>⬆</i>รายจ่าย</button>
   <button class="act" id="csv"><i>📄</i>CSV</button>
   <button class="act" id="share"><i>👪</i>ส่งครอบครัว</button>
  </div>
  <section class="panel"><h2>รายจ่ายตามหมวด</h2><div id="cats"></div></section>
  <button class="sec" id="reset" style="width:100%;color:var(--out);background:var(--card)">รีเซ็ตข้อมูลทั้งหมดเป็น 0</button>
 </div>
 <section class="panel">
  <div class="months"><button id="prev" aria-label="เดือนก่อนหน้า">‹</button><b id="mlabel"></b><button id="next" aria-label="เดือนถัดไป">›</button></div>
  <input class="search" id="q" placeholder="ค้นหารายการ">
  <div id="list"></div>
 </section>
</div>

<div class="sheet-bg" id="bg"><form class="sheet" id="f">
 <h2 id="st">เพิ่มรายการ</h2>
 <div class="seg"><button type="button" data-t="out" class="out on">รายจ่าย</button><button type="button" data-t="in" class="in">รายรับ</button></div>
 <label for="amt">จำนวนเงิน (บาท)</label>
 <input id="amt" class="big" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required>
 <div class="row"><div><label for="date">วันที่</label><input id="date" type="date" required></div><div><label for="cat">หมวดหมู่</label><select id="cat"></select></div></div>
 <label for="note">บันทึกเพิ่มเติม</label>
 <input id="note" placeholder="เช่น ข้าวกลางวัน (ไม่บังคับ)">
 <button class="pri">บันทึกรายการ</button>
 <button type="button" class="sec" id="cancel">ยกเลิก</button>
</form></div>
<div class="toast" id="toast"></div>

<script>
const CATS={out:[["อาหาร","🍜"],["เดินทาง","🚌"],["ที่พัก","🏠"],["ช้อปปิ้ง","🛍"],["บิล/ค่าบริการ","🧾"],["สุขภาพ","💊"],["บันเทิง","🎬"],["อื่น ๆ","📦"]],in:[["เงินเดือน","💼"],["งานเสริม","🛠"],["ของขวัญ","🎁"],["ดอกเบี้ย","🏦"],["อื่น ๆ","📥"]]};
const $=id=>document.getElementById(id);
const fmt=n=>"฿"+Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>"฿"+Number(n).toLocaleString("th-TH",{maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const todayISO=iso(new Date());
const icon=(t,c)=>(CATS[t].find(x=>x[0]===c)||["","🧾"])[1];
const thDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})};
const thDay=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const thMonth=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("th-TH",{month:"long",year:"numeric"})};
let items=[],type="out",month=todayISO.slice(0,7);
try{items=JSON.parse(localStorage.getItem("mt-items")||"[]")}catch(e){items=[]}
const save=()=>{try{localStorage.setItem("mt-items",JSON.stringify(items))}catch(e){}};
const sorted=l=>l.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const sums=l=>({i:l.filter(x=>x.t==="in").reduce((s,x)=>s+x.a,0),o:l.filter(x=>x.t==="out").reduce((s,x)=>s+x.a,0)});
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2800)}
function shiftMonth(n){const[y,m]=month.split("-").map(Number);const d=new Date(y,m-1+n,1);month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}

function render(){
 const all=sums(items),mm=items.filter(x=>x.date.startsWith(month)),ms=sums(mm);
 $("bal").textContent=fmt(all.i-all.o);$("mi").textContent=fmt0(ms.i);$("mo").textContent=fmt0(ms.o);
 $("mlabel").textContent=thMonth(month);
 const by={};mm.filter(x=>x.t==="out").forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 $("cats").innerHTML=top.length?top.map(([c,a])=>`<div class="cat"><span>${icon("out",c)}</span><span>${esc(c)}</span><b>${fmt0(a)}</b><div class="t"><i style="width:${a/ms.o*100}%"></i></div></div>`).join(""):'<div class="empty" style="padding:8px 0">ยังไม่มีรายจ่ายเดือนนี้</div>';
 const q=$("q").value.trim().toLowerCase();
 const v=sorted(mm.filter(x=>!q||(x.c+" "+x.n).toLowerCase().includes(q)));
 let html="",last="";
 v.forEach(x=>{
  if(x.date!==last){html+=`<div class="day">${thDay(x.date)}</div>`;last=x.date}
  html+=`<div class="tx"><div class="ic">${icon(x.t,x.c)}</div><div class="m"><div>${esc(x.n||x.c)}</div><span>${esc(x.c)}</span></div><div class="amt ${x.t}">${x.t==="in"?"+":"−"}${fmt(x.a)}</div><button class="del" data-id="${x.id}" aria-label="ลบรายการ">×</button></div>`;
 });
 $("list").innerHTML=html||'<div class="empty">ยังไม่มีรายการในเดือนนี้<br>กด “รายรับ” หรือ “รายจ่าย” เพื่อเริ่มบันทึก</div>';
}

function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c[0]}</option>`).join("")}
function setType(t){type=t;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));fillCats()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setType(b.dataset.t));
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{setType(b.dataset.add);$("date").value=todayISO;$("bg").classList.add("show");setTimeout(()=>$("amt").focus(),50)});
$("cancel").onclick=()=>$("bg").classList.remove("show");
$("bg").onclick=e=>{if(e.target===$("bg"))$("bg").classList.remove("show")};
$("f").onsubmit=e=>{
 e.preventDefault();
 const a=parseFloat($("amt").value);if(!(a>0))return;
 const date=$("date").value;
 items.push({id:Date.now(),t:type,a,c:$("cat").value,n:$("note").value.trim(),date});
 save();month=date.slice(0,7);$("amt").value="";$("note").value="";
 $("bg").classList.remove("show");render();toast("บันทึกแล้ว");
};
$("list").onclick=e=>{const id=e.target.dataset.id;if(!id)return;if(confirm("ลบรายการนี้ใช่ไหม?")){items=items.filter(x=>x.id!=id);save();render()}};
$("q").oninput=render;$("prev").onclick=()=>shiftMonth(-1);$("next").onclick=()=>shiftMonth(1);

function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

// CSV แบบสเตทเมนต์ธนาคาร: เรียงเก่า→ใหม่ มีคอลัมน์ ฝาก/ถอน และ ยอดเงินคงเหลือหลังทำรายการ (เปิดใน Excel ได้ ภาษาไทยไม่เพี้ยน)
$("csv").onclick=()=>{
 if(!items.length){toast("ยังไม่มีข้อมูลให้ดาวน์โหลด");return}
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const asc=items.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 let cents=0;
 const rows=["วันที่,รายการ,หมวดหมู่,รายรับ (ฝาก),รายจ่าย (ถอน),ยอดเงินคงเหลือ"].concat(asc.map(x=>{
  const c=Math.round(x.a*100);
  cents+=x.t==="in"?c:-c;
  return [x.date,q(x.n||x.c),q(x.c),x.t==="in"?x.a.toFixed(2):"",x.t==="out"?x.a.toFixed(2):"",(cents/100).toFixed(2)].join(",");
 }));
 download(new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"}),"สเตทเมนต์_"+todayISO+".csv");
 toast("ดาวน์โหลด CSV แล้ว");
};

// ไฟล์สรุปให้ครอบครัว: ตัวใหญ่ อ่านง่าย เปิดได้ทุกเครื่อง ไม่ต้องติดตั้งอะไร
function report(){
 const mm=sorted(items.filter(x=>x.date.startsWith(month))),s=sums(mm),all=sums(items);
 const by={};mm.filter(x=>x.t==="out").forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<tr><td>${icon("out",c)} ${esc(c)}</td><td class="r">${fmt(a)}</td></tr>`).join("");
 const rows=mm.map(x=>`<tr><td>${thDate(x.date)}</td><td>${icon(x.t,x.c)} ${esc(x.n||x.c)}<br><small>${esc(x.c)}</small></td><td class="r ${x.t}">${x.t==="in"?"+":"−"}${fmt(x.a)}</td></tr>`).join("");
 return `<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สรุปรายรับรายจ่าย ${thMonth(month)}</title><style>body{margin:0;background:#eef2f9;color:#12203a;font:18px/1.55 system-ui,"Noto Sans Thai",sans-serif}main{max-width:640px;margin:auto;padding:18px}h1{font-size:1.4rem;margin:0}.s{color:#6a7891;font-size:.85rem;margin:2px 0 14px}.hero{background:linear-gradient(135deg,#0a2f7a,#1b5ed8);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero b{display:block;font-size:2rem}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.c{background:#fff;border-radius:14px;padding:12px}.c b{display:block;font-size:1.2rem}h2{font-size:1rem;margin:16px 0 6px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}td{padding:11px 10px;border-bottom:1px solid #e8edf5;vertical-align:top}.r{text-align:right;white-space:nowrap;font-weight:700}small{color:#6a7891;font-size:.75rem}.in{color:#0e9f6e}.out{color:#d64545}</style></head><body><main><h1>สรุปรายรับรายจ่าย ${thMonth(month)}</h1><div class="s">จัดทำเมื่อ ${thDate(todayISO)}</div><div class="hero">เงินคงเหลือทั้งหมด<b>${fmt(all.i-all.o)}</b></div><div class="g"><div class="c">รายรับเดือนนี้<b class="in">${fmt(s.i)}</b></div><div class="c">รายจ่ายเดือนนี้<b class="out">${fmt(s.o)}</b></div></div>${cats?`<h2>ใช้จ่ายไปกับอะไรบ้าง</h2><table>${cats}</table>`:""}<h2>รายการทั้งหมด</h2><table>${rows||'<tr><td>ไม่มีรายการ</td></tr>'}</table></main></body></html>`;
}
$("share").onclick=async()=>{
 if(!items.some(x=>x.date.startsWith(month))){toast("เดือนนี้ยังไม่มีรายการให้สรุป");return}
 const file=new File([report()],"สรุปรายรับรายจ่าย_"+month+".html",{type:"text/html"});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"สรุปรายรับรายจ่าย "+thMonth(month)});return}}catch(e){if(e&&e.name==="AbortError")return}
 download(file,file.name);toast("บันทึกไฟล์แล้ว ส่งทาง LINE หรืออีเมลให้ครอบครัวได้เลย");
};
$("reset").onclick=()=>{if(confirm("ลบรายการทั้งหมดและรีเซ็ตยอดเป็น 0 ใช่ไหม? ย้อนกลับไม่ได้ (ควรโหลด CSV สำรองก่อน)")){items=[];save();try{localStorage.removeItem("mt-items")}catch(e){}month=todayISO.slice(0,7);$("q").value="";render();toast("รีเซ็ตเป็น 0 แล้ว")}};
fillCats();render();
</script>
</body>
</html>
